# Generated by oc-qa-ops `/oc-qa pyramid` + `/oc-qa audit`.
version: 1
generated: 2026-09-02

pyramid:
  levels:
    - name: unit
      belongs: "Pure deterministic logic: parsing, ranking, formatting, flag evaluation, and logger helpers."
      excluded: "Worker fetch routing, filesystem/subprocess work, KV bindings, external HTTP, and browser behavior."
      gate: commit
      target_runtime: "10s"
    - name: integration
      belongs: "Worker request routing with binding doubles; generator/CLI behavior in temp trees; local HTTP smoke behavior."
      excluded: "Live third-party services and browser-only interaction."
      gate: commit
      target_runtime: "20s"
    - name: contract
      belongs: "Cross-boundary shapes and invariants: MCP JSON-RPC/tools, skill catalogs, checkpoints/hooks, release seal/tag, and pack adapters."
      excluded: "Internal algorithms and user-visible layout."
      gate: commit
      target_runtime: "20s"
    - name: e2e
      belongs: "Sparse browser-visible Astro flows, accessibility, responsive geometry, and release-page behavior in Chromium."
      excluded: "Pure route/schema branches already covered by Vitest; live third-party calls."
      gate: ci
      target_runtime: "2m"
  anti_patterns:
    - "Conditional skips in CI for required user paths"
    - "Live third-party network dependencies in pull-request tests"
    - "Browser tests that merely restate pure filtering or schema assertions"
    - "Snapshotting volatile generated HTML, catalogs, or SKILL.md prose"
    - "Hard-coded registry counts when expectations can derive from source trees"

# Coverage is intentionally absent until Vitest emits measured data. An
# invented floor would violate the honest-budget rule; QA-G1 tracks the gap.
contracts:
  - boundary: "Browser feedback/notify clients <-> Worker POST handlers"
    artifact: "src/lib/schemas.js"
    tests: "tests/feedback.test.js; tests/notify.test.js"
    owner: in-repo
    gate: ci
    drift_signal: "request validation or response behavior changes without matching handler/client tests"
  - boundary: "MCP clients <-> hosted and stdio MCP transports"
    artifact: "src/lib/mcp/server.js"
    tests: "tests/mcp-server.test.js; tests/mcp-route.test.js"
    owner: in-repo
    gate: ci
    drift_signal: "JSON-RPC, tool schema, session, or checkpoint behavior changes"
  - boundary: "SKILL.md sources <-> catalogs, flags, and distributed bundles"
    artifact: "scripts/gen-skills-catalog.mjs"
    tests: "tests/catalog-generator.test.js; tests/flags-skills.test.js"
    owner: in-repo
    gate: ci
    drift_signal: "frontmatter, routing, reference, flag, or bundle drift"
  - boundary: "Checkpoint producers <-> commit/session control-plane consumers"
    artifact: "skills/oc-checkpoint-protocol/references/checkpoint-protocol.md"
    tests: "tests/checkpoint.test.js; plugins/opchain/hooks/test-gate.cjs"
    owner: in-repo
    gate: ci
    drift_signal: "schema or freshness/tree-binding behavior changes"
  - boundary: "Release metadata <-> signed tag, publisher, and deploy gate"
    artifact: "release-seal.json"
    tests: "tests/check-release-tag.test.js; tests/release-surfaces.test.js"
    owner: in-repo
    gate: ci
    drift_signal: "catalog version, seal digest, tag identity, or site release surfaces diverge"
  - boundary: "Stack-pack metadata <-> generated adapters and runtime dispatch"
    artifact: "scripts/gen-stack-packs.mjs"
    tests: "tests/stack-packs-real.test.js; tests/api-dev-adapters.test.js; tests/pack-dispatch.test.js"
    owner: in-repo
    gate: ci
    drift_signal: "pack schema, references, adapter commands, or dispatch semantics diverge"
