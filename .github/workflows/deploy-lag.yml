name: Deploy lag

# Every-fourth-day check against the approved release baseline, not raw main equality.
# A docs/checkpoint/workflow-only descendant of the deployed release is not a
# deployment gap. A change outside the explicit non-deploying path set is.
# Cloudflare state is authenticated through the control plane, so Bot Fight
# Mode remains enabled and no GitHub curl request hits the custom domain.

on:
  schedule:
    # Run on every fourth day-of-month and stay clear of top-of-hour load.
    - cron: "17 14 */4 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-lag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Compare approved baseline to deploy-relevant main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify production control-plane baseline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/cloudflare-monitor.mjs control-plane --environment production

      - name: Classify changes after the approved release
        id: diff
        env:
          DEPLOY_DIFF_FILE: ${{ runner.temp }}/deploy-relevant.txt
        run: node .github/scripts/cloudflare-monitor.mjs deploy-diff --output "$DEPLOY_DIFF_FILE"

      - name: Report branch validation without mutating issues
        if: github.ref != 'refs/heads/main'
        env:
          HAS_CHANGES: ${{ steps.diff.outputs.has_changes }}
          CHANGED_COUNT: ${{ steps.diff.outputs.changed_count }}
          IGNORED_COUNT: ${{ steps.diff.outputs.ignored_count }}
          BASELINE_TAG: ${{ steps.diff.outputs.baseline_tag }}
        run: |
          echo "redesign-validated-pending-merge: ${BASELINE_TAG}; deploy-relevant=${CHANGED_COUNT}; explicitly-non-deploying=${IGNORED_COUNT}; has-changes=${HAS_CHANGES}"
          echo "Branch dispatch is validation-only. Scheduled/default-branch monitoring remains unchanged until merge." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconcile deploy-lag issue on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_CHANGES: ${{ steps.diff.outputs.has_changes }}
          CHANGED_COUNT: ${{ steps.diff.outputs.changed_count }}
          IGNORED_COUNT: ${{ steps.diff.outputs.ignored_count }}
          BASELINE_SHA: ${{ steps.diff.outputs.baseline_sha }}
          BASELINE_TAG: ${{ steps.diff.outputs.baseline_tag }}
          DEPLOY_DIFF_FILE: ${{ runner.temp }}/deploy-relevant.txt
          ISSUE_TITLE: "Deploy lag: deploy-relevant changes after approved release"
          LEGACY_ISSUE_TITLE: "Deploy lag: production is behind main"
        run: |
          set -euo pipefail

          find_issue() {
            gh issue list \
              --state open \
              --search "in:title \"$1\"" \
              --json number,title \
              --jq "[.[] | select(.title == \"$1\")][0].number" 2>/dev/null || true
          }

          existing="$(find_issue "$ISSUE_TITLE")"
          legacy="$(find_issue "$LEGACY_ISSUE_TITLE")"
          head="$(git rev-parse origin/main)"

          if [ "$HAS_CHANGES" != "true" ]; then
            echo "ok: Cloudflare matches ${BASELINE_TAG}; ${IGNORED_COUNT} changed path(s) are explicitly non-deploying"
            for issue in "$existing" "$legacy"; do
              if [ -n "$issue" ]; then
                gh issue close "$issue" --comment "Resolved — Cloudflare matches approved baseline \`${BASELINE_TAG}\` (\`${BASELINE_SHA}\`), and changes through \`${head}\` are explicitly non-deploying. Closed automatically by the release-baseline deploy-lag monitor."
              fi
            done
            exit 0
          fi

          commits="$(git rev-list --count "${BASELINE_SHA}..origin/main")"
          {
            printf 'Cloudflare still matches the approved release baseline `%s` (`%s`).\n' "$BASELINE_TAG" "$BASELINE_SHA"
            printf 'Main is `%s`, with **%s deploy-relevant path(s)** across %s commit(s) after that baseline.\n\n' "$head" "$CHANGED_COUNT" "$commits"
            printf '### Deploy-relevant paths\n\n'
            sed 's/^/- `/' "$DEPLOY_DIFF_FILE" | sed 's/$/`/'
            printf '\n### Required action\n\n'
            printf 'Open a release/deploy workstream, review these changes, approve an exact runtime SHA, validate staging, and deploy that exact SHA. Refresh `.github/monitoring/release-baseline.json` only after the deployment and smoke evidence are complete.\n\n'
            printf '> This monitor intentionally does not require production to equal every main commit. Docs, checkpoints, workflows, tests, and other explicit non-deploying paths may advance without creating false lag.\n'
          } > "$RUNNER_TEMP/deploy-lag-body.md"

          if [ -n "$legacy" ]; then
            gh issue close "$legacy" --comment "Superseded by release-baseline/deploy-relevant semantics; raw main equality produced false lag for documentation-only commits."
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/deploy-lag-body.md"
            gh issue comment "$existing" --body "Still pending: baseline=\`${BASELINE_TAG}\`, main=\`${head}\`, deploy-relevant paths=${CHANGED_COUNT}."
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/deploy-lag-body.md"
          fi
