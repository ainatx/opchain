name: CI

# PR-only: main requires these same checks before merge, so a push trigger would
# only repeat the checks after merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — build, test, catalog verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install (root)
        run: npm ci
      - name: Install (site) — needed because `npm run build` now runs astro build
        working-directory: site
        run: npm ci
      - name: Verify the received candidate in CI
        env:
          OPCHAIN_VERSION: ${{ github.sha }}
        run: node scripts/verify-candidate.mjs run --repo . --json
      - name: Require source-bound Docs and Repo evidence
        run: npm run evidence:pr
      - name: Validate checkpoints (.checkpoints/<skill>.checkpoint.json)
        run: npm run checkpoint:validate
      - name: Plugin hook suites (commit gate + next-suggestion)
        # Compatibility fixtures for the plugin scripts; actual commit-boundary
        # and candidate verification tests also run in the unit suite.
        run: npm run test:hooks
      - name: Checkpoint drift report (errors block)
        # Errors fail the build: doctor's errors are schema failures checked
        # against each file's real path (a skill name that disagrees with the
        # filename, a missing required field, a bad timestamp), which is broken
        # state the next session would resume from. Warnings stay advisory (no
        # `--fail-on-warnings`): they depend on the calendar, the machine and git
        # history (a `complete` checkpoint ages past its threshold, project_dir
        # was authored elsewhere, a squash merge strands a verified SHA), so
        # blocking on them would redden unrelated PRs. v1.9.1 Sprint 3 took the
        # count to zero on a maintainer checkout; keep it there. CI itself always
        # shows project_dir warnings, because the runner's path differs. Never
        # add `--online` here — it fetches opchain.dev/api/health and would
        # couple PR success to production reachability (see
        # docs/runbooks/cloudflare-challenge.md).
        run: npm run checkpoint:doctor
      - name: Bundled skill references in sync with sources (fast-fail)
        # Also enforced transitively by pretest/prebuild; this is an explicit,
        # early signal so a source edit without a re-sync fails loudly.
        run: npm run sync-bundles:check
      - name: Verify .claude/skills/ has no drift from skills/
        run: |
          # Each .claude/skills/<name> must be a symlink to ../../skills/<name>.
          # Tracking copies leads to stale runtime instructions (audit PR #157).
          fail=0
          for entry in .claude/skills/*; do
            name=$(basename "$entry")
            if [[ ! -L "$entry" ]]; then
              echo "::error file=$entry::not a symlink — .claude/skills/$name must symlink to ../../skills/$name"
              fail=1
              continue
            fi
            target=$(readlink "$entry")
            expected="../../skills/$name"
            if [[ "$target" != "$expected" ]]; then
              echo "::error file=$entry::symlink points to '$target', expected '$expected'"
              fail=1
            fi
          done
          for d in skills/*/; do
            name=$(basename "$d")
            if [[ ! -e ".claude/skills/$name" ]]; then
              echo "::error file=skills/$name::no .claude/skills/$name symlink — runtime won't see this skill"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "✓ .claude/skills/ ↔ skills/ symlinks are clean"
      - name: Unit tests
        run: npm test
      - name: Build worker (regenerates catalog, builds site, bundles worker)
        env:
          OPCHAIN_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-dist
          path: dist/
          retention-days: 7

  site:
    name: Site — install, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Astro check (type + content validation)
        working-directory: site
        run: npm run check
      - name: Build
        working-directory: site
        run: npm run build

  site-e2e:
    name: Site — Playwright e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    needs: site
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install (site)
        working-directory: site
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: site
        run: npx playwright install-deps chromium
      - name: Generate roadmap data (GitHub Issues on asfbay-bit/opchain-skills)
        # Authenticate the public read with the job token to avoid the shared
        # runner IP's anonymous quota. The generator already supports this;
        # the browser assertions still fail if no real roadmap items load.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/gen-roadmap.mjs
      - name: Build (static)
        working-directory: site
        env:
          PUBLIC_POSTHOG_KEY: phc_test_e2e
          PUBLIC_POSTHOG_HOST: http://127.0.0.1:9999
        run: npm run build
      - name: Run Playwright tests
        id: e2e
        working-directory: site
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

      - name: Post axe violation summary as PR comment
        # One marked comment per PR, edited in place. A failed Playwright step
        # creates or refreshes it; a passing step only edits an existing one to
        # say the latest run passed, so a green PR never gains a comment.
        # Skipped when Playwright never ran or the run was cancelled. The step
        # outcome, not the contents of site/test-results, decides: green runs
        # leave compare.spec.ts screenshots there too.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (steps.e2e.outcome == 'failure' || steps.e2e.outcome == 'success') }}
        uses: actions/github-script@v9
        env:
          AXE_RESULTS_DIR: site/test-results
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const path = require('path');
            const { planComment } = require(
              path.resolve(process.env.GITHUB_WORKSPACE, 'scripts/axe-comment.cjs')
            );
            const issue_number = context.payload.pull_request.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number,
                per_page: 100,
              });
              const plan = planComment({
                dir: process.env.AXE_RESULTS_DIR,
                outcome: process.env.E2E_OUTCOME,
                comments,
                sha: context.payload.pull_request.head.sha,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              core.info(`axe comment: ${plan.action} (${plan.reason})`);
              if (plan.action === 'create') {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body: plan.body });
              } else if (plan.action === 'update') {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: plan.commentId, body: plan.body });
              }
            } catch (error) {
              // Read-only tokens (fork and Dependabot PRs) cannot comment. The
              // comment is diagnostic, so it must not turn a green job red.
              core.warning(`axe comment skipped: ${error.status ? `${error.status} ` : ''}${error.message}`);
            }
