name: Canary

# GitHub-hosted curl traffic to the public custom domains is challenged by
# Cloudflare Free-plan Bot Fight Mode before it reaches the Worker. Keep that
# protection enabled. This canary instead uses Cloudflare's authenticated
# control plane to prove that the approved deployment/version is current at
# 100% traffic, its script fingerprint + fetch handler match, observability is
# enabled, and each custom domain is associated with the expected Worker.
#
# Assurance limit: this does not prove /api/health JSON, asset/dependency
# behavior, latency, or unchallenged public machine access to /mcp. Those remain
# covered only by point-in-time operator smoke/live-log evidence while Bot Fight
# Mode challenges GitHub-hosted traffic.

on:
  schedule:
    # Run on every fourth day-of-month, away from the top-of-hour scheduler
    # load and before the deploy-lag check on the same monitoring day.
    - cron: "47 13 */4 * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Control-plane environment to verify"
        required: false
        default: all
        type: choice
        options:
          - all
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control-plane:
    name: Verify approved Cloudflare baseline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment, version, traffic, script, domains, and logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MONITOR_ENVIRONMENT: ${{ inputs.environment || 'all' }}
        run: node .github/scripts/cloudflare-monitor.mjs control-plane

      - name: Record assurance boundary
        if: always()
        run: |
          {
            echo '### Canary assurance boundary'
            echo
            echo 'This run checks Cloudflare control-plane deployment, version, traffic, script fingerprint/handler/binding, observability, and custom-domain association.'
            echo 'It does **not** send GitHub-hosted curl traffic through Bot Fight Mode and does not prove public `/api/health` or `/mcp` reachability, response semantics, assets, dependencies, or latency.'
          } >> "$GITHUB_STEP_SUMMARY"
