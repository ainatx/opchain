name: Lighthouse

# PR-only: main requires this same check before merge, so a push trigger would
# only repeat the check after merge.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: LHCI — perf, a11y, best-practices, SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Use npm 11 (lockfile format)
        # Node 22's npm 10 rejects npm 11 / Dependabot lockfiles; see ci.yml.
        run: npm install -g npm@11 && npm -v
      - name: Install (site)
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        env:
          # Match the production build: PostHog public key baked, beacon token absent
          # so CF Web Analytics doesn't try to load. Keeping these out of the LHCI run
          # avoids third-party network noise during scoring.
          PUBLIC_POSTHOG_KEY: ""
        run: npm run build
      - name: Run LHCI
        working-directory: site
        run: npx --no -- lhci autorun --config=../lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # A pull request from a fork gets a read-only token whatever `permissions:`
      # says, so createComment answered 403 and failed this required job after
      # the budgets had passed (PR 680). Same-repository pull requests keep the
      # comment; a fork gets the same summary on the run page.
      - name: Post LHCI score summary as PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          LHCI_DIR: site/.lighthouseci
        with:
          script: |
            const path = require('path');
            const { buildComment } = require(
              path.resolve(process.env.GITHUB_WORKSPACE, 'scripts/lhci-comment.cjs')
            );
            const body = buildComment(process.env.LHCI_DIR);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Write LHCI score summary to the run page (fork pull request)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        # The summary is a convenience; the budgets above are the gate.
        continue-on-error: true
        env:
          LHCI_DIR: site/.lighthouseci
        run: node -e "process.stdout.write(require('./scripts/lhci-comment.cjs').buildComment(process.env.LHCI_DIR) + '\n')" >> "$GITHUB_STEP_SUMMARY"
