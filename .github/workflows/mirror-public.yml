name: Mirror skills to public repo

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills-work/**'
      - 'mirror/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/mirror-public.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-public
  cancel-in-progress: false

jobs:
  mirror:
    name: Force-push snapshot to asfbay-bit/opchain-skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate mirror inputs
        run: |
          set -euo pipefail
          missing=()
          for f in skills skills-work/ow-protocol.md skills-work/README.md LICENSE NOTICE mirror/README.md mirror/CONTRIBUTING.md mirror/SECURITY.md mirror/.github/ISSUE_TEMPLATE \
                   plugins/opchain/.claude-plugin/plugin.json plugins/opchain/hooks/hooks.json \
                   plugins/opchain/hooks/pre-commit-gate.cjs plugins/opchain/hooks/session-state.cjs \
                   plugins/opchain/hooks/next-suggestion.cjs plugins/opchain/commands .claude-plugin/marketplace.json \
                   plugins/ow-tools/.claude-plugin/plugin.json plugins/ow-tools/.claude-plugin/marketplace.json \
                   plugins/ow-tools/hooks/hooks.json plugins/ow-tools/bin/ow-tools plugins/ow-tools/python/uv.lock; do
            if [[ ! -e "$f" ]]; then
              missing+=("$f")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::missing files for mirror: ${missing[*]}"
            exit 1
          fi
          echo "all mirror inputs present"

      - name: Assemble staging tree
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          mkdir -p "$STAGE/.github"
          cp -R skills "$STAGE/skills"
          cp -R skills-work "$STAGE/skills-work"
          cp LICENSE "$STAGE/LICENSE"
          cp NOTICE "$STAGE/NOTICE"
          cp mirror/README.md "$STAGE/README.md"
          cp mirror/CONTRIBUTING.md "$STAGE/CONTRIBUTING.md"
          cp mirror/SECURITY.md "$STAGE/SECURITY.md"
          cp -R mirror/.github/ISSUE_TEMPLATE "$STAGE/.github/ISSUE_TEMPLATE"
          # Plugin + marketplace. Without these the public repo is skills-only:
          # `/plugin marketplace add` finds nothing and the gates — the entire
          # point of the plugin — never reach a user. plugins/opchain/skills is
          # a real directory since seam S5 (materialised by
          # scripts/sync-plugin-skills.mjs, drift-gated in pretest); `-L` stays
          # as belt-and-braces for any future symlink. plugins/ow-tools ships its
          # own marketplace manifest (plugins/ow-tools/.claude-plugin/
          # marketplace.json) so admins can approve it apart from the dev one.
          cp -RL plugins "$STAGE/plugins"
          cp -R .claude-plugin "$STAGE/.claude-plugin"
          echo "Staged tree:"
          find "$STAGE" -maxdepth 3 -type f | sort | sed "s|$STAGE/|  |"

      - name: Force-push to asfbay-bit/opchain-skills
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${MIRROR_TOKEN:-}" ]]; then
            echo "::error::MIRROR_TOKEN secret is not set; cannot push mirror"
            exit 1
          fi
          cd "$STAGE"
          git init -q -b main
          git config user.name "opchain-mirror-bot"
          git config user.email "mirror-bot@opchain.dev"
          git add -A
          git commit -q -m "Mirror from ainatx/opchain@${SOURCE_SHA:0:7}"
          git remote add origin "https://x-access-token:${MIRROR_TOKEN}@github.com/asfbay-bit/opchain-skills.git"
          # A delayed or re-run job must not restore an older marketplace
          # pointer after a newer source commit has pinned the release.
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin main
          LATEST_SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)"
          if [[ "$LATEST_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            if git -C "$GITHUB_WORKSPACE" diff --quiet "$SOURCE_SHA" "$LATEST_SOURCE_SHA" -- \
                skills skills-work mirror plugins .claude-plugin LICENSE NOTICE .github/workflows/mirror-public.yml; then
              echo "source main advanced only outside mirror inputs; this snapshot remains current"
            else
              DIFF_STATUS=$?
              if [[ "$DIFF_STATUS" -ne 1 ]]; then
                echo "::error::cannot compare current mirror inputs; refusing push"
                exit 1
              fi
              echo "::notice::mirror inputs advanced; their newer workflow owns the refresh"
              exit 0
            fi
          fi
          git push --force origin main
          echo "mirror push complete"
