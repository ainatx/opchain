version: 2

# Weekly dependency PRs grouped per ecosystem so we can review in batches
# instead of drowning in 20 one-line PRs.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      worker-runtime:
        patterns:
          - "esbuild"
          - "wrangler"
          - "@cloudflare/*"
      worker-test:
        patterns:
          - "vitest"
          - "@vitest/*"
      zod:
        patterns:
          - "zod"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "worker"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      markdown:
        patterns:
          - "marked"
          - "dompurify"
          - "isomorphic-dompurify"
    ignore:
      # TypeScript 7 cannot install in site/: @astrojs/check@0.9.10 declares
      # peer typescript "^5.0.0 || ^6.0.0", so every job died at `npm ci`
      # (PR #471, 2026-09-11). Lift this once @astrojs/check accepts 7.x;
      # 6.x stays eligible.
      - dependency-name: "typescript"
        versions: ["7.x"]
    commit-message:
      prefix: "deps(site)"
    labels:
      - "dependencies"
      - "site"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
