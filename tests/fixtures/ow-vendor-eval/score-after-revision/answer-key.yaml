# INVENTED. C7, C11: -score after revision 1 re-scores every vendor still in under ## After revision 1, with the
# revision's weights in the calc items; the first scores stay as written.
case: score-after-revision
ws: larkspur-ceramics
eval: VE-01-inventory-tool
client: Larkspur Ceramics
user: Robin
tools: true
vendors:
  - name: Tallowmere Stock
    host: tallowmere.example
  - name: Brackenfold Inventory
    host: brackenfold.example
  - name: Marrowby Goods
    host: marrowby.example
key: /ow-vendor-eval-score
section: C7 re-score after a revision; C22 a re-score is appended
checks:
  - headers
  - writes
  - write_once
  - status
  - screen
  - next
  - resume
  - credentials
  - private_names
  - approvals
  - handling
  - scores
  - self_checks
status:
  lines:
    - path: vendor-eval/larkspur-ceramics/VE-01-inventory-tool/scores.md
      next: ow-vendor-eval /ow-vendor-eval-recommend vendor-eval/larkspur-ceramics/VE-01-inventory-tool/
      awaiting: none
next:
  - use ow-vendor-eval-recommend on vendor-eval/larkspur-ceramics/VE-01-inventory-tool/
base: revise-larkspur
