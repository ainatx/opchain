# INVENTED. Design §10 Criteria first, C7: a change of weights after scores exist is a dated revision with its
# reason and the client's agreement to the revision's criteria set; the next -score re-scores every vendor.
case: revise-larkspur
ws: larkspur-ceramics
eval: VE-01-inventory-tool
client: Larkspur Ceramics
user: Robin
tools: true
vendors:
  - name: Tallowmere Stock
    host: tallowmere.example
  - name: Brackenfold Inventory
    host: brackenfold.example
  - name: Marrowby Goods
    host: marrowby.example
key: /ow-vendor-eval-scope --revise
section: C7 --revise after scores (dated, reasoned, agreed)
