# INVENTED. -recommend: the one-page recommendation, its sections named exactly as ow-draft's D2 fields,
# every score and cost copied from scores.md and cost.md, the conflicts statement's exact none line;
# written, then checked, then exported through ow-tools (the client form in export/client/, its digest
# in the header). NEXT: -decide, and ow-draft for a longer report.
case: recommend-larkspur
ws: larkspur-ceramics
eval: VE-01-inventory-tool
client: Larkspur Ceramics
user: Robin
tools: true
vendors:
  - name: Tallowmere Stock
    host: tallowmere.example
  - name: Brackenfold Inventory
    host: brackenfold.example
  - name: Marrowby Goods
    host: marrowby.example
section: C14 recommendation (D2 sections); C8 the none line; C18 NEXT only with no FINDING
key: /ow-vendor-eval-recommend
checks:
  - headers
  - writes
  - write_once
  - status
  - screen
  - next
  - resume
  - credentials
  - private_names
  - approvals
  - handling
  - recommendation
  - conflicts
  - self_checks
  - internal_numbers
  - handoff_fields
status:
  lines:
    - path: vendor-eval/larkspur-ceramics/VE-01-inventory-tool/recommendation.md
      next: ow-vendor-eval /ow-vendor-eval-decide vendor-eval/larkspur-ceramics/VE-01-inventory-tool/
      awaiting: none
next:
  - use ow-vendor-eval-decide tallowmere on vendor-eval/larkspur-ceramics/VE-01-inventory-tool/
  - use ow-draft-evidence on vendor-eval/larkspur-ceramics/VE-01-inventory-tool/recommendation.md
base: score-larkspur
