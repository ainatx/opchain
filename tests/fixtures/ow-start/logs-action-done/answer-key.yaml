# Answer key: logs-action-done (INVENTED). C8: -action A-03 done appends one
# closing line in the O2 form; notes.md is never edited.
kind: logs
case: logs-action-done
workstream: larkspur-ceramics
user: Robin
base: logs-decision-from-meeting
verbs: [/ow-start-action]
checks: [writes, write_once, status, status_grammar, route, screen, private_names, handling]
route:
  verb: /ow-start-action
  says: ["Appended:", "Open in larkspur-ceramics:"]
  tokens: [["Appended:", "notes.md#A-03", "none (closed: done)"]]
screen:
  tokens: [["A-01", "client ops lead", "2026-10-16"], ["A-02", "you", "2026-10-19"], ["DEC-01", "2026-10-19"], ["Self-checks", "No client text in STATUS", "No private names"]]
  must_not: ["\\bA-03\\b[^\\n|]*client owner"]
status:
  lines:
    - { path: logs/larkspur-ceramics/meetings/MTG-01/notes.md#A-03, next: "none (closed: done)", awaiting: none (done 2026-10-15) }
