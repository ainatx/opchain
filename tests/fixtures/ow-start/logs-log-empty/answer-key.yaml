# Answer key: logs-log-empty (INVENTED). C4 -log route, an empty workstream: say
# so; nothing from another client appears; writes nothing.
kind: logs
case: logs-log-empty
workstream: meridian-tile
user: Robin
base: logs-prep-first
verbs: [/ow-start-log]
writes_nothing: true
checks: [writes, status, route, screen, private_names, handling]
route:
  verb: /ow-start-log
screen:
  must: ["Nothing logged yet for meridian-tile"]
  tokens: [["Self-checks", "Index copies nothing", "People by role", "No private names"]]
  must_not: ["^(?!Step 0\\.).*\\b(?:MTG|A|DEC)-\\d{2}\\b", "^(?!Step 0\\.).*larkspur", "^(?!Step 0\\.).*\\b(?:intake|plans|builds|uat|care|handoffs)/"]
status: { lines: [] }
