# Answer key: logs-log-empty (INVENTED). C4 -log route, an empty workstream: say
# so; nothing from another client appears; writes nothing.
kind: logs
case: logs-log-empty
workstream: meridian-tile
user: Robin
base: logs-prep-first
verbs: [/ow-start-log]
writes_nothing: true
checks: [writes, status, route, screen, private_names]
route: { verb: /ow-start-log }
screen:
  must: ["Nothing logged yet"]
  must_not: ["^- ", "^larkspur"]
status: { lines: [] }
private_names: [llc-ops, Deftwright]
