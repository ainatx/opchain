# Answer key: logs-no-workstream-log (INVENTED). Round 1 m5: a bare /ow-start-log
# with logs in two workstreams lists them and asks; writes nothing.
kind: logs
case: logs-no-workstream-log
workstream: larkspur-ceramics
user: Robin
base: logs-business-vendor
verbs: [/ow-start-log]
writes_nothing: true
checks: [writes, status, route, private_names]
route:
  verb: /ow-start-log
  ask: "which workstream"
  says: ["larkspur-ceramics", "business"]
  never: ["^- MTG-01"]
status: { lines: [] }
