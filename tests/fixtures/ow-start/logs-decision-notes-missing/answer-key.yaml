# Answer key: logs-decision-notes-missing (INVENTED). The notes reads row's
# absent case: ask for the decision and its source; nothing from memory.
kind: logs
case: logs-decision-notes-missing
workstream: larkspur-ceramics
user: Robin
base: logs-decision-from-meeting
verbs: [/ow-start-log-decision]
