# Answer key: logs-no-workstream-action (INVENTED). Round 1 m5: ids are numbered
# per workstream, so a bare A-01 can mean two actions: list them and ask which
# workstream; write nothing.
kind: logs
case: logs-no-workstream-action
workstream: larkspur-ceramics
user: Robin
base: logs-business-vendor
verbs: [/ow-start-action]
writes_nothing: true
checks: [writes, status, route, private_names, handling]
route:
  verb: /ow-start-action
  ask: "which workstream"
  tokens: [["larkspur-ceramics"], ["business"]]
status: { lines: [] }
