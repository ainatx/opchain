# Answer key: logs-decision-from-meeting (INVENTED). C9 from a meeting: offers D1
# and D2, writes only the one the user picks, with a review line; the Confirmed
# line carries protocol §8's working-note sentence. C4: none logged, offer each.
kind: logs
case: logs-decision-from-meeting
workstream: larkspur-ceramics
user: Robin
base: logs-larkspur-checkin
verbs: [/ow-start-log-decision]
checks: [headers, writes, write_once, status, status_grammar, route, decision, people, private_names, gitignore, handling]
route:
  verb: /ow-start-log-decision
  tokens: [["D1"], ["D2"], ["DONE:", "logs/larkspur-ceramics/decisions/DEC-01.md"], ["Self-checks", "Trace", "People by role", "No client text in STATUS", "Never edited", "No private names"], ["NEXT: none", "/ow-status"]]
decision:
  files:
    - { id: DEC-01, review: 2026-10-19, supersedes: none, subject: "logs/larkspur-ceramics/meetings/MTG-01/notes.md#D1", confirmed: client }
status:
  lines:
    - { path: logs/larkspur-ceramics/decisions/DEC-01.md, next: "ow-start /ow-start-action logs/larkspur-ceramics/", awaiting: DEC-01 review by 2026-10-19 }
git: { repo: false }
names: [Dana, Jess, Marcus]
