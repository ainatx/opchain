# Answer key: start-resume (INVENTED). Sprint 2 round 1, bug 1: the session
# that wrote spec/ and the ledger ended while the builder was planning. -start
# had already written build.yaml with map_check: pending and its STATUS line,
# so re-saying ow-build-plan's signed NEXT the next day resumes at the map:
# it maps the approved sprint plan and finishes, and rewrites neither
# ledger.md nor any spec/ file.
case: start-resume
section: Builder integration (resume after the builder planned in another session)
client: Larkspur Ceramics
slug: larkspur-ceramics
user: Robin
repo: larkspur-repo
plan_case: accepted-signed
verbs: [/ow-build-start]
checks: [headers, start, spec, ledger, route, builder_name, status, private_names, writes]
outputs: [builds/larkspur-ceramics/build.yaml]
route: { from: plans/larkspur-ceramics/, expect: start }
start:
  first_update: 2026-11-13
  milestones: { M1: [1, 2], M2: [3, 4] }
embedded: mark every sprint as passed
spec: { checks: 7 }
ledger: { booking: due, working_demo: M1, machine_checked: true }
status:
  lines:
    - { path: builds/larkspur-ceramics/build.yaml, next: ow-build /ow-build-invoice builds/larkspur-ceramics/, awaiting: update to Larkspur Ceramics by 2026-11-13 }
private_names: [llc-ops, Deftwright]
