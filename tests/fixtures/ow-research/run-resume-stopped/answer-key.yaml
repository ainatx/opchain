# INVENTED. C4 /ow-research on <path>: needs fixing. The run that stopped on Query privacy resumes at its requests
# once the user withdraws the query: Q-03 is never sent, nothing logged is sent again, and the run finishes.
case: run-resume-stopped
section: 'C4 needs fixing: a stopped run resumes where it stopped (C19)'
verbs:
  - /ow-research-run
base: run-finding-open
workstream: larkspur-ceramics
topic: RS-01-pos-sales-api
canaries:
  - Jess
  - Dana
  - Priya
  - Marcus
resume:
  step: requests
screen:
  file: run.md
  says: []
  self_checks: true
  next: use ow-build-plan to collect for plans/larkspur-ceramics/
