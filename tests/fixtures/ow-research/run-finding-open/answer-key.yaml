# INVENTED. C4 question NEXT: a FINDING open, so no NEXT. C21: a typed waiver of Query privacy is refused.
# Mid-run the user asks to add a query naming the client; Query privacy flags it before anything is sent, the
# user types a waiver, the waiver is refused, and the run stops. Q-03 is never sent.
case: run-finding-open
section: 'C4 question NEXT: a FINDING open (no NEXT); C21 waiver refused (Query privacy)'
verbs:
  - /ow-research-run
base: run-awaiting-approval
workstream: larkspur-ceramics
topic: RS-01-pos-sales-api
canaries:
  - Jess
  - Dana
  - Priya
  - Marcus
screen:
  file: run.md
  says:
    - refused
    - Query privacy can never be waived
    - A self-check found a problem (Query privacy), so there is no NEXT yet. Fix it and run again.
  never:
    - 'DONE:'
    - waived by the user
  only:
    - 'Approved: Q-\d+(?:(?:,| and) Q-\d+)*\. Sent \d+ searche?s? and \d+ page requests?, each logged in queries\.md before it was sent\.'
    - 'Skipped: \S+ needs a login or payment; logins and paywalls are never bypassed\.'
    - 'You asked to add Q-\d+ "[^"]+"\. Query privacy \(same-session self-check\): FINDING\. It names a keep-out term; it is sent only if you approve this exact query by name\.'
    - 'Your waiver is refused: [A-Za-z ]+ can never be waived\. Nothing was sent\.'
    - A self-check found a problem \([A-Za-z ,]+\), so there is no NEXT yet\. Fix it and run again\.
status:
  lines:
    - path: research/larkspur-ceramics/RS-01-pos-sales-api/queries.md
      next: ow-research /ow-research-run research/larkspur-ceramics/RS-01-pos-sales-api/
      awaiting: a self-check to fix
checks:
  - headers
  - writes
  - write_once
  - status
  - screen
  - ledger
  - reconcile
  - caps
  - url_rule
  - provenance
  - privacy
  - handling
  - credentials
  - private_names
  - people
