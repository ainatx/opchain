# INVENTED. C4 /ow-research on <path>: a path that is not a research folder; nothing is run.
case: on-unknown
section: 'C4 /ow-research on <path>: not a research folder'
verbs:
  - /ow-research
base: run-approved
canaries:
  - Jess
  - Dana
  - Priya
  - Marcus
route:
  from: plans/larkspur-ceramics/
  expect: nothing
screen:
  file: on.md
  says:
    - This is not a research topic or framework folder; nothing was run.
  never:
    - 'DONE:'
  only:
    - This is not a research topic or framework folder; nothing was run\.
    - It takes research/<workstream>/RS-nn-<slug>/ or research/frameworks/<id>/<date>/\.
status:
  lines: []
checks:
  - writes
  - status
  - route
  - screen
  - private_names
  - people
writes_nothing: true
