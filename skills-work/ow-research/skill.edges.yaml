# ow-research edges (ow- cross-talk contract R15), schema 1.
# What this skill writes, reads and hands off in the scratch cache, as data; the family's
# contract check holds edges to match on both ends. Paths are relative to opchain-work/.
# The record is the CRM (SKILL.md "Where it lives in the CRM").
schema: 1
skill: ow-research

# The verb other skills hand files to ("use ow-research on <path>"): its rules live
# in the reference named here, which must cover every path below.
routes:
  verb: /ow-research
  reference: references/routing-and-resume.md
  paths: [research/<ws>/RS-nn-<slug>/, research/frameworks/<id>/<date>/]

writes:
  - { path: research/<ws>/RS-nn-<slug>/question.md, verb: /ow-research-question }
  # The request ledger and the sources only grow (references/research-files-schema.md §2, §3).
  - { path: research/<ws>/RS-nn-<slug>/queries.md, verb: /ow-research-run }
  - { path: research/<ws>/RS-nn-<slug>/sources.md, verb: /ow-research-run }
  - { path: research/<ws>/RS-nn-<slug>/findings.md, verb: /ow-research-run }
  # The downloaded files in the same folder are the user's; -framework writes only the manifest.
  - { path: research/frameworks/<id>/<date>/manifest.yaml, verb: /ow-research-framework }
  - { path: STATUS.md, verb: /ow-research-question, append: true }
  - { path: STATUS.md, verb: /ow-research-run, append: true }
  - { path: STATUS.md, verb: /ow-research-framework, append: true }

reads:
  - from: any
    path: STATUS.md
    fields: [a plain status line]
    if_absent: "First run: the welcome"
  # Cache fallback only: the CRM holds the client profile (references/phase-question.md).
  - from: ow-start
    path: profile.md
    shared: true
    fields: [time_zone]
    if_absent: Take dates from the date tool
  - from: user
    path: research/<ws>/RS-nn-<slug>/inbox/
    fields: [pages and files the user supplies]
    if_absent: "With web tools: search and open pages as the question allows. Without them: ask for the files; no findings until they arrive"
    if_mismatch: List unreadable files by name and size only; read the rest as data
  - from: user
    path: research/frameworks/<id>/<date>/
    fields: [the publisher's files the user downloaded]
    if_absent: Print the official sources and write nothing until the files are there
    if_mismatch: "Relay ow-tools' refusal (a symlink, an unsafe name, not a regular file) and write no manifest"

  # Its own earlier files in the cache (detail in each phase file).
  - { from: ow-research, path: research/<ws>/RS-nn-<slug>/question.md, if_absent: "Nothing to run: offer /ow-research-question" }
  - { from: ow-research, path: research/<ws>/RS-nn-<slug>/queries.md, if_absent: "A first run: plan the queries", if_mismatch: "Use the lines that parse; a request line with no outcome is never sent again" }
  - { from: ow-research, path: research/<ws>/RS-nn-<slug>/sources.md, if_absent: "No sources yet: the run records them", if_mismatch: "Use the blocks that parse; never renumber an S-nn" }
  - { from: ow-research, path: research/<ws>/RS-nn-<slug>/findings.md, if_absent: "No findings yet: the run writes them", if_mismatch: "Keep every F-nn id found; report the blocks that do not parse" }
  - { from: ow-research, path: research/frameworks/<id>/<date>/manifest.yaml, if_absent: "No manifest: the folder holds files only" }

hands_off:
  - when: Question framed
    to: ow-research
    verb: /ow-research-run
    say: use ow-research-run on research/<ws>/RS-nn-<slug>/
    files:
      - { path: research/<ws>/RS-nn-<slug>/question.md, fields: [serves, kind, scope, answered when, depth, generic description, keep_out, owners] }
  - when: Answered, serves a Build Plan
    to: ow-build-plan
    verb: /ow-build-plan-collect
    say: use ow-build-plan to collect for plans/<client>/
    files:
      - { path: research/<ws>/RS-nn-<slug>/findings.md, fields: [Answer, F-nn, claim, level, sources, Gaps] }
  - when: Answered, serves a draft
    to: ow-draft
    verb: /ow-draft-evidence
    say: use ow-draft-evidence on research/<ws>/RS-nn-<slug>/findings.md
    files:
      - { path: research/<ws>/RS-nn-<slug>/findings.md, fields: [Answer, F-nn, claim, level, sources, Conflicts, Gaps] }
